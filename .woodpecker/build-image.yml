labels:
  platform: linux/amd64

when:
  event: [tag]
  ref: [refs/tags/v*, refs/tags/v*-pre, refs/tags/v*-test]

depends_on: [validate-release]

steps:
  build-image:
    image: moby/buildkit:v0.24.0-rootless@sha256:912777d2903627ebe3a3fcf7be2380d64e1d45d4ee515f91bb2b14c0a869f41c
    privileged: false
    commands:
      - scripts/ci/build-image.sh
    environment:
      BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
      DOCKER_USERNAME:
        from_secret: DOCKER_USERNAME
      DOCKER_PASSWORD:
        from_secret: DOCKER_PASSWORD
