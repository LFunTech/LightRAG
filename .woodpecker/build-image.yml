labels:
  platform: linux/amd64

workspace:
  base: /woodpecker
  path: src

when:
  - event: tag
    evaluate: 'CI_COMMIT_TAG matches "^v[0-9]+[.][0-9]+[.][0-9]+(-pre|-test)?$"'
  - event: tag
    ref: refs/tags/v*

depends_on: [validate-release]

skip_clone: true

steps:
  download-source:
    image: docker-hub.f123.pub/base/ci-tools:alpine-3.22.4
    commands:
      - |
        set -euo pipefail
        : "$${STORAGE_ENDPOINT:?STORAGE_ENDPOINT is required}"
        : "$${STORAGE_BUCKET:?STORAGE_BUCKET is required}"
        : "$${STORAGE_ACCESS_KEY:?STORAGE_ACCESS_KEY is required}"
        : "$${STORAGE_SECRET_KEY:?STORAGE_SECRET_KEY is required}"
        resolve_storage_endpoint() {
          endpoint="$${1:-}"
          case "$endpoint" in
            http://*)
              scheme="http"
              rest="$${endpoint#http://}"
              ;;
            https://*)
              scheme="https"
              rest="$${endpoint#https://}"
              ;;
            *)
              scheme="https"
              rest="$endpoint"
              ;;
          esac

          host="$${rest%%/*}"
          host="$${host%%\?*}"
          host="$${host%%#*}"
          if [ -z "$host" ]; then
            echo "storage endpoint host is empty" >&2
            return 64
          fi

          printf '%s://%s\n' "$scheme" "$host"
        }
        STORAGE_ENDPOINT_ROOT="$(resolve_storage_endpoint "$STORAGE_ENDPOINT")"
        ARTIFACT_PREFIX="lightrag/ci-source/$CI_COMMIT_SHA/$CI_PIPELINE_NUMBER"
        SOURCE_ARCHIVE_DIR="$${LIGHTRAG_SOURCE_ARCHIVE_DIR:-build/source-artifact}"
        rm -rf "$SOURCE_ARCHIVE_DIR"
        mkdir -p "$SOURCE_ARCHIVE_DIR"
        mc alias set deploy "$STORAGE_ENDPOINT_ROOT" "$STORAGE_ACCESS_KEY" "$STORAGE_SECRET_KEY"
        mc cp "deploy/$STORAGE_BUCKET/$ARTIFACT_PREFIX/source.tar.gz" "$SOURCE_ARCHIVE_DIR/source.tar.gz"
        mc cp "deploy/$STORAGE_BUCKET/$ARTIFACT_PREFIX/source.tar.gz.sha256" "$SOURCE_ARCHIVE_DIR/source.tar.gz.sha256"
        mc cp "deploy/$STORAGE_BUCKET/$ARTIFACT_PREFIX/source-record.json" "$SOURCE_ARCHIVE_DIR/source-record.json"
        (cd "$SOURCE_ARCHIVE_DIR" && sha256sum -c source.tar.gz.sha256)
        test -s "$SOURCE_ARCHIVE_DIR/source-record.json"
        echo "source archive downloaded: $ARTIFACT_PREFIX -> $SOURCE_ARCHIVE_DIR"
    environment:
      STORAGE_ENDPOINT:
        from_secret: cos_storage_endpoint
      STORAGE_BUCKET:
        from_secret: cos_storage_bucket
      STORAGE_ACCESS_KEY:
        from_secret: cos_storage_secret_id
      STORAGE_SECRET_KEY:
        from_secret: cos_storage_secret_key
  build-image:
    image: docker-hub.f123.pub/devops/kaniko:v1.14.0-debug@sha256:1b282be1c4467618e9122d2ae457ffa3776a7caa52d7539e329123283bc71f79
    privileged: false
    depends_on: [download-source]
    backend_options:
      kubernetes:
        resources:
          requests:
            cpu: 1000m
            memory: 2Gi
            ephemeral-storage: 20Gi
          limits:
            cpu: 4000m
            memory: 8Gi
            ephemeral-storage: 40Gi
    commands:
      - |
        set -eu
        if (set -o pipefail) 2>/dev/null; then
          set -o pipefail
        fi
        SOURCE_ARCHIVE_DIR="$${LIGHTRAG_SOURCE_ARCHIVE_DIR:-build/source-artifact}"
        SOURCE_DIR="$${LIGHTRAG_SOURCE_DIR:-/kaniko/lightrag-source}"
        test -s "$SOURCE_ARCHIVE_DIR/source.tar.gz"
        test -s "$SOURCE_ARCHIVE_DIR/source.tar.gz.sha256"
        rm -rf "$SOURCE_DIR"
        mkdir -p "$SOURCE_DIR"
        (cd "$SOURCE_ARCHIVE_DIR" && sha256sum -c source.tar.gz.sha256)
        tar -xzf "$SOURCE_ARCHIVE_DIR/source.tar.gz" -C "$SOURCE_DIR"
        test -f "$SOURCE_DIR/scripts/ci/build-image.sh"
        cd "$SOURCE_DIR"
        export LIGHTRAG_BUILD_CONTEXT_DIR="$SOURCE_DIR"
        sh scripts/ci/build-image.sh
    environment:
      HOME: /kaniko
      REGISTRY: docker-hub.f123.pub
      LIGHTRAG_IMAGE_REPOSITORY: lfun/lightrag
      LIGHTRAG_IMAGE_CACHE_REPOSITORY: lfun/cache-lightrag
      DOCKER_USERNAME:
        from_secret: DOCKER_USERNAME
      DOCKER_PASSWORD:
        from_secret: DOCKER_PASSWORD
