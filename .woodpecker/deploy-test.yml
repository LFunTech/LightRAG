labels:
  platform: linux/amd64

when:
  event: [tag]
  ref: [refs/tags/v*-test]

depends_on: [pre-deploy]

steps:
  resolve-image:
    image: docker-hub.f123.pub/base/uv:python3.12-bookworm-slim-lightrag-e5b65587bce7@sha256:e5b65587bce7de595f299855d7385fe7fca39b8a74baa261ba1b7147afa78e58
    commands:
      - mkdir -p build/release
      - python -m scripts.ci.delivery resolve-image --tag "$CI_COMMIT_TAG" --commit "$CI_COMMIT_SHA" --image "docker-hub.f123.pub/lfun/lightrag" --record-output build/release/image-record.json --env-output build/release/image.env
    environment:
      REGISTRY_USERNAME:
        from_secret: registry_username
      REGISTRY_PASSWORD:
        from_secret: registry_password
  deploy-test:
    image: docker-hub.f123.pub/base/ci-tools:alpine-3.22.2
    depends_on: [resolve-image]
    commands:
      - test -s build/release/image.env
      - . build/release/image.env && scripts/ci/deploy-test.sh
    environment:
      LIGHTRAG_TEST_KUBECONFIG:
        from_secret: lightrag_test_kubeconfig
