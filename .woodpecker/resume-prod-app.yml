labels:
  platform: linux/amd64

workspace:
  base: /woodpecker
  path: src

skip_clone: true

when:
  - event: manual
    branch: master

steps:
  resume-prod-app:
    image: docker-hub.f123.pub/base/ci-tools:alpine-3.22.4
    commands:
      - |
        set -eu
        : "$${LIGHTRAG_PROD_APP_RESUME_CONFIRM:?explicit app-only approval is required}"
        : "$${LIGHTRAG_PROD_KUBECONFIG:?existing prod kubeconfig is required}"
        test "$CI_REPO" = LFunTech/LightRAG
        test "$CI_PIPELINE_EVENT" = manual
        test "$CI_COMMIT_BRANCH" = master
        export GIT_TERMINAL_PROMPT=0
        umask 077
        SOURCE_DIR="$(mktemp -d /tmp/lightrag-app-resume.XXXXXX)"
        trap 'rm -rf "$SOURCE_DIR"' EXIT
        git init "$SOURCE_DIR"
        git -C "$SOURCE_DIR" remote add origin "https://github.com/LFunTech/LightRAG.git"
        git -C "$SOURCE_DIR" fetch --depth 1 origin "$CI_COMMIT_SHA"
        git -C "$SOURCE_DIR" checkout --detach FETCH_HEAD
        test "$(git -C "$SOURCE_DIR" rev-parse HEAD)" = "$CI_COMMIT_SHA"
        printf '%s' "$LIGHTRAG_PROD_KUBECONFIG" > "$SOURCE_DIR/prod-kubeconfig"
        cd "$SOURCE_DIR"
        if [ "$LIGHTRAG_PROD_APP_RESUME_CONFIRM" = prod-config-only-20261024 ]; then
          # Reuse the test deployment's apply/rollout pattern, never its initialization/recover.
          export KUBECONFIG="$SOURCE_DIR/prod-kubeconfig"
          k() { kubectl --namespace prod --request-timeout=60s "$@"; }
          CONFIG_DIR=k8s-deploy/lightrag-kustomize/overlays/prod/config-only-20261024
          NAMESPACE_UID="$(k get namespace prod -o jsonpath='{.metadata.uid}')"
          test "$NAMESPACE_UID" = bd5be22f-6336-4200-815e-16e79278f213
          INITIAL_JOB="$(k get job lightrag-initial-1fb1bdc91acdac1c78cc -o jsonpath='{.metadata.uid}:{.status.succeeded}')"
          test "$INITIAL_JOB" = 632a7b01-6d1a-4f11-9137-0591815bcf7a:1
          RUNTIME_SECRET="$(k get secret lightrag-blue-e5da9efed3c2cfbb4ad61420 -o jsonpath='{.metadata.uid}:{.immutable}')"
          test "$RUNTIME_SECRET" = b2b666f1-f3c7-457d-a03d-d5acfd57f159:true
          READY_REPLICAS="$(k get deployment lightrag-blue -o jsonpath='{.status.readyReplicas}')"
          case "$READY_REPLICAS" in ''|0) ;; *) echo 'Existing serving Pods; stopping before replacement' >&2; exit 1;; esac
          POD_UIDS="$(k get pods -l lightrag.io/deployment=lightrag_prod -o jsonpath='{range .items[*]}{.metadata.uid}{"\n"}{end}')"
          test "$(printf '%s\n' "$POD_UIDS" | sort | tr '\n' ',')" = 18e5846a-f399-4b6e-ab38-a5c46bcad138,57c7d9e7-0289-4766-b3ac-9c514104d2d1,6ad162e2-bcde-43be-920f-fef65ebccb0d,c30e3244-11a1-423f-b3ee-40bd68e6af9c,
          SERVICE="$(k get service lightrag --ignore-not-found -o name)"
          test -z "$SERVICE"
          INGRESS="$(k get ingress lightrag --ignore-not-found -o name)"
          test -z "$INGRESS"
          k apply -f "$CONFIG_DIR/configmap.json"
          k patch deployment lightrag-blue --type=json --patch-file "$CONFIG_DIR/deployment-patch.json"
          kubectl --namespace prod rollout status deployment/lightrag-blue --timeout=900s
          REPLICAS="$(k get deployment lightrag-blue -o jsonpath='{.spec.replicas}:{.status.updatedReplicas}:{.status.availableReplicas}')"
          test "$REPLICAS" = 4:4:4
          IMAGE_IDS="$(k get pods -l lightrag.io/deployment=lightrag_prod -o jsonpath='{range .items[*].status.containerStatuses[*]}{.imageID}{"\n"}{end}')"
          case "$(printf '%s\n' "$IMAGE_IDS" | sort -u)" in containerd://sha256:496b46a29266d62895842d09d7ce132be9c4a326699e32095467bebc13b8d4db|docker-hub.f123.pub/lfun/lightrag@sha256:496b46a29266d62895842d09d7ce132be9c4a326699e32095467bebc13b8d4db) ;; *) echo 'Unexpected image digest; stopping before entry creation' >&2; exit 1;; esac
          k apply -f "$CONFIG_DIR/entry.json"
          k get deployment,pods -l lightrag.io/deployment=lightrag_prod -o wide
          k get service,ingress lightrag -o wide
          echo 'KUBERNETES_READY: original v1.5.9 image, configuration-only; external entry and capacity not certified'
        else
          python3 -m scripts.ci.prod_app_resume --kubeconfig "$SOURCE_DIR/prod-kubeconfig" --approval k8s-deploy/lightrag-kustomize/overlays/prod/app-resume-76.json
        fi
    environment:
      LIGHTRAG_PROD_KUBECONFIG:
        from_secret: lightrag_prod_kubeconfig
