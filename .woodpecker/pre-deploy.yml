labels:
  platform: linux/amd64

workspace:
  base: /woodpecker
  path: src

when:
  event: [tag]
  ref: [refs/tags/v*, refs/tags/v*-pre, refs/tags/v*-test]

depends_on: [build-image]

skip_clone: true

steps:
  download-source:
    image: docker-hub.f123.pub/base/ci-tools:alpine-3.22.2
    commands:
      - |
        set -euo pipefail
        : "${STORAGE_ENDPOINT:?STORAGE_ENDPOINT is required}"
        : "${STORAGE_BUCKET:?STORAGE_BUCKET is required}"
        : "${STORAGE_ACCESS_KEY:?STORAGE_ACCESS_KEY is required}"
        : "${STORAGE_SECRET_KEY:?STORAGE_SECRET_KEY is required}"
        resolve_storage_endpoint() {
          endpoint="${1:-}"
          case "$endpoint" in
            http://*)
              scheme="http"
              rest="${endpoint#http://}"
              ;;
            https://*)
              scheme="https"
              rest="${endpoint#https://}"
              ;;
            *)
              scheme="https"
              rest="$endpoint"
              ;;
          esac

          host="${rest%%/*}"
          host="${host%%\?*}"
          host="${host%%#*}"
          if [ -z "$host" ]; then
            echo "storage endpoint host is empty" >&2
            return 64
          fi

          printf '%s://%s\n' "$scheme" "$host"
        }
        STORAGE_ENDPOINT_ROOT="$(resolve_storage_endpoint "$STORAGE_ENDPOINT")"
        ARTIFACT_PREFIX="lightrag/ci-source/$CI_COMMIT_SHA/$CI_PIPELINE_NUMBER"
        rm -rf /tmp/lightrag-source
        mkdir -p /tmp/lightrag-source
        mc alias set deploy "$STORAGE_ENDPOINT_ROOT" "$STORAGE_ACCESS_KEY" "$STORAGE_SECRET_KEY"
        mc cp "deploy/$STORAGE_BUCKET/$ARTIFACT_PREFIX/source.tar.gz" /tmp/lightrag-source/source.tar.gz
        mc cp "deploy/$STORAGE_BUCKET/$ARTIFACT_PREFIX/source.tar.gz.sha256" /tmp/lightrag-source/source.tar.gz.sha256
        mc cp "deploy/$STORAGE_BUCKET/$ARTIFACT_PREFIX/source-record.json" /tmp/lightrag-source/source-record.json
        (cd /tmp/lightrag-source && sha256sum -c source.tar.gz.sha256)
        find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
        tar -xzf /tmp/lightrag-source/source.tar.gz -C .
        test -f scripts/ci/delivery.py
        echo "source archive downloaded: $ARTIFACT_PREFIX"
    environment:
      STORAGE_ENDPOINT:
        from_secret: cos_storage_endpoint
      STORAGE_BUCKET:
        from_secret: cos_storage_bucket
      STORAGE_ACCESS_KEY:
        from_secret: cos_storage_secret_id
      STORAGE_SECRET_KEY:
        from_secret: cos_storage_secret_key
  verify-image:
    image: docker-hub.f123.pub/base/uv:python3.12-bookworm-slim-lightrag-e5b65587bce7@sha256:e5b65587bce7de595f299855d7385fe7fca39b8a74baa261ba1b7147afa78e58
    depends_on: [download-source]
    commands:
      - mkdir -p build/release
      - python -m scripts.ci.delivery resolve-image --tag "$CI_COMMIT_TAG" --commit "$CI_COMMIT_SHA" --image "docker-hub.f123.pub/lfun/lightrag" --record-output build/release/image-record.json
    environment:
      DOCKER_USERNAME:
        from_secret: DOCKER_USERNAME
      DOCKER_PASSWORD:
        from_secret: DOCKER_PASSWORD
