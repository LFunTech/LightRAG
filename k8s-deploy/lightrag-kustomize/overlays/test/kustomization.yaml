apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: lightrag-test
resources:
  - ../../base
  - release-image.yaml
  - public-entrypoint.yaml
  - deployer-rbac.yaml
replacements:
  - source:
      kind: ConfigMap
      name: lightrag-release-image
      fieldPath: data.digest
    targets:
      - select:
          kind: Deployment
          name: lightrag
        fieldPaths:
          - spec.template.spec.containers.[name=lightrag].image
        options:
          delimiter: "@"
          index: 1
  - source:
      kind: ConfigMap
      name: lightrag-test-public-entrypoint
      fieldPath: data.host
    targets:
      - select:
          kind: Ingress
          name: lightrag
        fieldPaths:
          - spec.rules.0.host
  - source:
      kind: ConfigMap
      name: lightrag-test-public-entrypoint
      fieldPath: data.ingressClassName
    targets:
      - select:
          kind: Ingress
          name: lightrag
        fieldPaths:
          - spec.ingressClassName
