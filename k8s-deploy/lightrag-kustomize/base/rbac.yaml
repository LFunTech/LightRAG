apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lightrag-runtime
rules:
  - apiGroups: [""]
    resources: ["configmaps", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lightrag-runtime
subjects:
  - kind: ServiceAccount
    name: lightrag
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lightrag-runtime
