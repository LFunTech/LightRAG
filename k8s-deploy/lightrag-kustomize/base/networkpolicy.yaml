apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lightrag-test-app-private
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: lightrag
      app.kubernetes.io/instance: lightrag
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              lightrag.openai.com/internal-caller: "true"
        - podSelector:
            matchLabels:
              lightrag.openai.com/acceptance-job: "true"
      ports:
        - protocol: TCP
          port: 9621
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              lightrag.openai.com/backend-access: "true"
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8080
    - ports:
        - protocol: TCP
          port: 443
