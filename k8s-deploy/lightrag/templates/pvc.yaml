{{- if and .Values.persistence.enabled (eq (include "lightrag.workloadKind" .) "Deployment") }}
{{- range $key, $suffix := dict "ragStorage" "rag-storage" "inputs" "inputs" }}
{{- $volume := index $.Values.persistence $key }}
{{- if not $volume.existingClaim }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "lightrag.fullname" $ }}-{{ $suffix }}
  annotations:
    # Keep data when a kind/existingClaim change removes this PVC from the
    # rendered chart, and on uninstall. Retired claims require operator cleanup.
    "helm.sh/resource-policy": keep
  labels:
    {{- include "lightrag.labels" $ | nindent 4 }}
spec:
  accessModes:
    {{- toYaml (default (list "ReadWriteOnce") $volume.accessModes) | nindent 4 }}
  {{- if hasKey $volume "storageClassName" }}
  storageClassName: {{ $volume.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $volume.size }}
{{- end }}
{{- end }}
{{- end }}
